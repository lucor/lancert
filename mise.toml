[tools]
go = "1.26.5"
"go:github.com/air-verse/air" = "latest"
"go:github.com/letsencrypt/pebble/v2/cmd/pebble" = "latest"
"go:filippo.io/mkcert" = "latest"
"github:mattn/goreman" = "latest"

[env]
# Safe local-development defaults. Production must provide its own environment.
LANCERT_DATA_DIR = "./data"
LANCERT_DNS_ADDR = "127.0.0.1:1053"
LANCERT_HTTP_ADDR = "127.0.0.1:8443"
LANCERT_IP_HASH_SALT = "lancert-mise-dev-only"
LANCERT_SERVER_IP = "127.0.0.1"
LANCERT_ACME_ENV = "local"
LANCERT_PREGEN = "false"

[tasks.setup]
description = "Install Go dependencies and prepare local Pebble assets"
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p ./data ./bin ./.mise/pebble
go mod download
rm -f ./.mise/pebble/rootCA.pem ./.mise/pebble/rootCA-key.pem ./.mise/pebble/localhost.crt ./.mise/pebble/localhost.key
CAROOT=./.mise/pebble mkcert \
  -cert-file ./.mise/pebble/localhost.crt \
  -key-file ./.mise/pebble/localhost.key \
  localhost 127.0.0.1
chmod 600 ./.mise/pebble/rootCA-key.pem ./.mise/pebble/localhost.key
"""

[tasks.dev]
description = "Run Pebble and lancert with hot reload for local ACME testing"
run = """
#!/usr/bin/env bash
set -euo pipefail
goreman -f .mise/Procfile start
"""

[tasks.fmt]
description = "Format Go source files"
run = "go fmt ./..."

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.race]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run the Go static checks"
run = "go vet ./..."

[tasks.check]
description = "Run the standard local checks"
run = [
  "go vet ./...",
  "go test ./...",
]

[tasks.build]
description = "Build a static lancert binary"
run = [
  "mkdir -p ./bin",
  "CGO_ENABLED=0 go build -o ./bin/lancert ./cmd/lancert",
]
