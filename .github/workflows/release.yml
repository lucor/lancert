name: Publish container and GitHub release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: ghcr.io/lucor/lancert

jobs:
  verify-ci:
    name: Verify tag passed CI on main
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points to a commit on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          }

      - name: Verify successful CI run for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit=$(git rev-parse HEAD)
          successful_runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$tag_commit" -f branch=main -f event=push \
            -f status=completed -f per_page=100 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')

          if [[ "$successful_runs" -eq 0 ]]; then
            echo "No successful CI run on main found for $tag_commit" >&2
            exit 1
          fi

  publish:
    needs: verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}

  release:
    name: Publish GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
