<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Lancert v2 API reference for hostname registration and scoped DNS-01 updates."><meta name="theme-color" content="#FFFFFF"><link rel="icon" href="/assets/favicon.ico" sizes="48x48"><link rel="icon" href="/assets/favicon.svg" sizes="any" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><title>lancert — API Reference</title><style>

      --lan: #078DE5;
      --lan-soft: #E5F4FE;
      --cert: #6B9E8A;
      --cert-soft: #E5F0EA;
      --ink: #1a1a1a;
      --text: #374151;
      --muted: #6b7280;
      --subtle: #9ca3af;
      --line: #e5e7eb;
      --bg: #ffffff;
      --surface: #f9fafb;
      --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      font-size: 16px;
    }

    a { color: var(--lan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── NAV ── */
    .nav {
      max-width: 1040px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      font-weight: 750;
      font-size: 20px;
      letter-spacing: -.03em;
    }

    .logo:hover { text-decoration: none; }
    .logo img { display: block; width: 128px; height: auto; }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
    }

    .nav-links a.active { color: var(--ink); font-weight: 600; }
    .nav-links a:hover { color: var(--ink); text-decoration: none; }

    .gh-star {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 12px;
      transition: border-color 0.15s;
    }

    .gh-star:hover { border-color: var(--muted); text-decoration: none; color: var(--ink); }
    .gh-star svg { width: 15px; height: 15px; fill: currentColor; }

    @media (max-width: 640px) {
      .nav { padding: 16px 20px; flex-wrap: wrap; gap: 12px; }
      .nav-links { gap: 16px; flex-wrap: wrap; justify-content: center; }
      .nav-links a { font-size: 13px; }
    }
